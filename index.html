<style>
/* ── RESET & APP SHELL ────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  height: 100%;
  /* Prevent iOS bounce scroll */
  overflow: hidden;
  position: fixed;
  width: 100%;
}

body {
  height: 100%;
  width: 100%;
  font-family: Georgia, serif;
  background: #1c1917;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  /* Safe area insets for notched phones */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  overflow: hidden;
}

/* Allow text selection inside inputs/textareas */
input, textarea { -webkit-user-select: text; user-select: text; }

/* App container — full screen scrollable */
#root {
  height: 100%;
  width: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  background: #fafaf9;
}

/* ── SPLASH SCREEN ────────────────────────────────────── */
#splash {
  position: fixed;
  inset: 0;
  background: #1c1917;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.4s ease;
}
#splash.hidden { opacity: 0; pointer-events: none; }
.splash-icon { font-size: 64px; margin-bottom: 16px; }
.splash-title { color: #fafaf9; font-size: 24px; font-weight: 400; letter-spacing: -0.01em; }
.splash-sub { color: #a8a29e; font-size: 13px; margin-top: 8px; letter-spacing: 0.1em; text-transform: uppercase; }
.splash-dots { display: flex; gap: 8px; margin-top: 32px; }
.splash-dot { width: 8px; height: 8px; border-radius: 50%; background: #a8a29e; animation: pulse 1.2s infinite; }
.splash-dot:nth-child(2) { animation-delay: 0.2s; }
.splash-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8);} 50%{opacity:1;transform:scale(1);} }

/* ── LAYOUT ───────────────────────────────────────────── */
.screen { min-height: 100%; padding-bottom: 80px; }
button, input, textarea, select { font-family: inherit; -webkit-appearance: none; appearance: none; }
input[type=date] { -webkit-appearance: none; }

/* ── HEADER ───────────────────────────────────────────── */
.header { background: #1c1917; padding: 14px 16px 0; position: sticky; top: 0; z-index: 10; }
.header h1 { color: #fafaf9; font-size: 20px; font-weight: 400; margin: 2px 0 0; }
.header p.family-label { color: #a8a29e; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; margin: 0; }
.header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.header-actions { display: flex; align-items: center; gap: 6px; }

/* ── TABS ─────────────────────────────────────────────── */
.tabs { display: flex; gap: 4px; margin-top: 12px; }
.tab-btn { padding: 10px 20px; border: none; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px; position: relative; transition: all .15s; }

/* ── CONTENT ──────────────────────────────────────────── */

.stats { display: flex; gap: 8px; margin-bottom: 16px; }

.card { background: white; border: 1px solid #e7e5e4; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }

.card-actions { display: flex; gap: 8px; margin-top: 10px; }
.small-btn { padding: 5px 12px; background: white; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; border: 1px solid #e7e5e4; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: flex-end; }
.modal { background: white; border-radius: 20px 20px 0 0; width: 100%; max-height: 88vh; overflow-y: auto; padding-bottom: 32px; position: relative; -webkit-overflow-scrolling: touch; }

.input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #e7e5e4; border-radius: 8px; font-size: 14px; outline: none; background: #fafaf9; }
.duration-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 20px; }
.dur-btn { padding: 10px 4px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.3; border: 2px solid #e7e5e4; background: white; color: #44403c; }
.dur-btn.active, .dur-btn:active { border-color: #1c1917; background: #1c1917; color: white; }
.dur-btn.wide { grid-column: span 2; }
.kid-selector { display: flex; gap: 8px; margin-bottom: 20px; }
.kid-sel-btn { flex: 1; padding: 12px 8px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 700; border: 2px solid #e7e5e4; background: white; color: #78716c; }
.preset-cat { margin-bottom: 8px; }
.preset-cat-btn { width: 100%; padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 14px; font-weight: 700; border: 1px solid #e7e5e4; border-radius: 10px; background: #fafaf9; color: #1c1917; }
.preset-cat-btn.open { border-radius: 10px 10px 0 0; background: #1c1917; color: white; }
.preset-items { border: 1px solid #e7e5e4; border-top: none; border-radius: 0 0 10px 10px; overflow: hidden; }
.preset-item { padding: 11px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f5f5f4; }
.preset-item:last-child { border-bottom: none; }
.preset-item.selected { background: #fff7ed; }
.checkbox { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #e7e5e4; background: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.checkbox.checked { border: none; background: #f97316; }
.overlap-overlay { position: absolute; inset: 0; background: rgba(255,255,255,.97); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; z-index: 10; }
.settings-modal { background: white; border-radius: 20px 20px 0 0; width: 100%; max-height: 90vh; overflow-y: auto; padding-bottom: 40px; }
.status-badge { border-radius: 12px; padding: 12px 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.empty-state { text-align: center; padding: 40px 20px; color: #a8a29e; }
.empty-icon { font-size: 36px; margin-bottom: 8px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
.cal-day { border-radius: 8px; padding: 6px 2px 4px; text-align: center; cursor: pointer; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; border: 1px solid #e7e5e4; background: white; }
.cal-day.today { border: 1.5px solid #a8a29e; background: #f5f5f4; }
.cal-day.selected { background: #1c1917; }
.cal-dot-row { display: flex; gap: 2px; margin-top: 3px; justify-content: center; }
.cal-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.journal-entry { background: white; border: 1px solid #e7e5e4; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.comment { background: #f5f5f4; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
.summary-card { background: white; border-radius: 14px; padding: 14px; }
.gear-btn { background: #292524; border: none; border-radius: 8px; padding: 5px 9px; font-size: 18px; cursor: pointer; line-height: 1; }
.parent-btn { background: #292524; border: none; border-radius: 8px; padding: 4px 10px; color: #a8a29e; font-size: 11px; cursor: pointer; }

/* ── PARENT SELECTOR ──────────────────────────────────── */
.parent-screen { min-height: 100vh; background: #1c1917; display: flex; flex-direction: column; padding: 20px; }
.parent-card { background: white; border-radius: 20px; padding: 32px 24px; text-align: center; width: 100%; max-width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.parent-name-btn { display: block; width: 100%; padding: 16px; margin-bottom: 12px; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .1s, opacity .1s; }
.parent-name-btn:active { transform: scale(.97); opacity: .9; }
</style>

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function todayStr() { return new Date().toISOString().split("T")[0]; }
function addDays(d,n) { var x=new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return x.toISOString().split("T")[0]; }
function fmtDate(s) { if(!s)return"—"; return new Date(s+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function fmtDT(s) { if(!s)return""; return new Date(s).toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
function daysLeft(e) {
  if(!e)return null;
  var n=new Date();n.setHours(0,0,0,0);
  var d=new Date(e);d.setHours(0,0,0,0);
  return Math.ceil((d-n)/86400000);
}
function isActive(c) {
  if(c.lifted_early)return false;
  if(!c.end_date)return true;
  return daysLeft(c.end_date)>=0;
}
function statusBadge(c) {
  if(c.lifted_early)return'<span class="badge" style="color:#6b7280;background:#f3f4f6">Lifted Early</span>';
  if(!c.end_date)return'<span class="badge" style="color:#2563eb;background:#eff6ff">Ongoing</span>';
  var l=daysLeft(c.end_date);
  if(l<0)return'<span class="badge" style="color:#6b7280;background:#f3f4f6">Expired</span>';
  if(l===0)return'<span class="badge" style="color:#dc2626;background:#fef2f2">Ends Today</span>';
  if(l<=2)return'<span class="badge" style="color:#dc2626;background:#fef2f2">'+l+'d left</span>';
  return'<span class="badge" style="color:#16a34a;background:#f0fdf4">'+l+'d left</span>';
}
function isoDay(y,m,d) { return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
function cOnDay(cons,ds) {
  return cons.filter(function(c) {
    if(c.lifted_early)return false;
    var s=c.start_date||ds,e=c.end_date;
    if(ds<s)return false;
    if(e&&ds>e)return false;
    return true;
  });
}
function overlapping(cons,kidIdx,sd,ed) {
  return cons.filter(function(c) {
    if(c.kid_idx!==kidIdx)return false;
    if(!isActive(c))return false;
    var es=c.start_date,ee=c.end_date;
    if(ed&&es&&ed<es)return false;
    if(ee&&sd&&ee<sd)return false;
    return true;
  });
}

window.goStep1 = function() { state.addStep=1; state.overlapWarning=null; render(); };
window.setAddKid = function(i) { state.addKidIdx=i; render(); };
window.setDuration = function(d) { state.addDuration=d; render(); };
window.setAddStart = function(v) { state.addStart=v; render(); };
window.setAddNote = function(v) { state.addNote=v; };

function canProceed() {
  if(!state.selectedPreset)return false;
  if(state.selectedPreset.custom)return state.customText.trim().length>0;
  return true;
}

window.submitAdd = function() {
  var desc = state.selectedPreset.custom ? state.customText.trim() : state.selectedPreset.text;
  if(!desc)return;
  var ed = state.addDuration ? addDays(state.addStart, state.addDuration-1) : null;
  var ov = overlapping(state.consequences, state.addKidIdx, state.addStart, ed);
  if(ov.length>=2 && !state.overlapWarning) { state.overlapWarning={list:ov,endDate:ed}; render(); return; }
  doAdd(desc, ed);
};

window.confirmAnyway = function() {
  var desc = state.selectedPreset.custom ? state.customText.trim() : state.selectedPreset.text;
  doAdd(desc, state.overlapWarning ? state.overlapWarning.endDate : (state.addDuration ? addDays(state.addStart,state.addDuration-1):null));
};

function doAdd(desc, ed) {
  var data = {kid_idx:state.addKidIdx, description:desc, start_date:state.addStart, end_date:ed||null, note:state.addNote.trim(), added_by:state.currentParent, lifted_early:false};
  sbFetch("/consequences",{method:"POST",body:JSON.stringify(data)})
    .then(function(r){ var saved=Array.isArray(r)?r[0]:r; state.consequences.unshift(saved); state.addStep=0; state.overlapWarning=null; render(); })
    .catch(function(er){ alert("Save failed: "+er.message); });
}

window.liftEarly = function(id) {
  sbFetch("/consequences?id=eq."+id,{method:"PATCH",body:JSON.stringify({lifted_early:true})})
    .then(function(){ state.consequences=state.consequences.map(function(c){return c.id===id?Object.assign({},c,{lifted_early:true}):c;}); render(); })
    .catch(function(){});
};

window.deleteC = function(id) {
  if(!confirm("Delete this consequence?"))return;
  sbFetch("/consequences?id=eq."+id,{method:"DELETE",prefer:""})
    .then(function(){ state.consequences=state.consequences.filter(function(c){return c.id!==id;}); render(); })
    .catch(function(){});
};

window.switchParent = function() { state.currentParent=null; store_set("current_parent",""); render(); };
window.setParent = function(p) { state.currentParent=p; store_set("current_parent",p); render(); };
window.openSettings = function() { state.showSettings=true; state.settingsKey=""; state.settingsSaved=false; render(); };
window.closeSettings = function() { state.showSettings=false; render(); };
window.settingsKeyInput = function(v) { state.settingsKey=v; };
window.saveSettings = function() { state.settingsSaved=true; render(); setTimeout(function(){state.showSettings=false;render();},1500); };

window.calPrev = function() { if(state.calMonth===0){state.calMonth=11;state.calYear--;}else state.calMonth--; state.calSel=null; render(); };
window.calNext = function() { if(state.calMonth===11){state.calMonth=0;state.calYear++;}else state.calMonth++; state.calSel=null; render(); };
window.calSelect = function(d) { state.calSel=state.calSel===d?null:d; render(); };

window.setJournalKid = function(i) { state.journalKid=i; render(); };
window.journalInput = function(v) { state.journalText=v; };
window.addJournalEntry = function() {
  var txt=state.journalText.trim(); if(!txt)return;
  sbFetch("/behavior_journal",{method:"POST",body:JSON.stringify({kid_idx:state.journalKid,entry:txt,added_by:state.currentParent})})
    .then(function(r){ var s=Array.isArray(r)?r[0]:r; state.journalEntries.unshift(s); state.journalText=""; e("journal-input").value=""; render(); })
    .catch(function(){});
};

window.toggleComments = function(id) {
  state.openComments[id]=!state.openComments[id];
  if(state.openComments[id] && !state.comments[id]) {
    sbFetch("/consequence_comments?consequence_id=eq."+id+"&order=created_at.asc")
      .then(function(d){ state.comments[id]=d; render(); }).catch(function(){});
  }
  render();
};
window.commentInput = function(id,v) { state.commentDrafts[id]=v; };
window.sendComment = function(id) {
  var txt=(state.commentDrafts[id]||"").trim(); if(!txt)return;
  sbFetch("/consequence_comments",{method:"POST",body:JSON.stringify({consequence_id:id,author:state.currentParent,body:txt})})
    .then(function(r){ var s=Array.isArray(r)?r[0]:r; if(!state.comments[id])state.comments[id]=[]; state.comments[id].push(s); state.commentDrafts[id]=""; e("comment-input-"+id).value=""; render(); })
    .catch(function(){});
};

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function render() {
  var root = e("root");
  if(!root)return;

  // Parent selector
  if(!state.currentParent) {
    root.innerHTML = renderParentSelector();
    return;
  }

  root.innerHTML = renderApp();

  // Re-attach live inputs
  var ci = e("custom-input");
  if(ci) { ci.value=state.customText; ci.oninput=function(){window.customInput(this.value);}; }
  var ai = e("add-note-input");
  if(ai) { ai.value=state.addNote; ai.oninput=function(){window.setAddNote(this.value);}; }
  var ji = e("journal-input");
  if(ji) { ji.value=state.journalText; ji.oninput=function(){window.journalInput(this.value);}; }
  var si = e("settings-key-input");
  if(si) { si.value=state.settingsKey; si.oninput=function(){window.settingsKeyInput(this.value);}; }
  var asd = e("add-start-date");
  if(asd) { asd.value=state.addStart; asd.onchange=function(){window.setAddStart(this.value);}; }
  Object.keys(state.commentDrafts).forEach(function(id) {
    var el=e("comment-input-"+id);
    if(el){el.value=state.commentDrafts[id]||"";el.oninput=function(){window.commentInput(id,this.value);};}
  });
}

function renderParentSelector() {
  return '<div style="min-height:100vh;background:#fafaf9;display:flex;flex-direction:column;padding:20px;">'+
    '<div style="display:flex;justify-content:flex-end;margin-bottom:8px;"><button class="gear-btn" onclick="openSettings()">⚙️</button></div>'+
    '<div style="flex:1;display:flex;align-items:center;justify-content:center;">'+
    '<div style="text-align:center;max-width:320px;width:100%;">'+
    '<div style="font-size:40px;margin-bottom:12px;">👋</div>'+
    '<h2 style="font-size:20px;font-weight:700;color:#1c1917;margin:0 0 8px;">Who\'s using the app?</h2>'+
    '<p style="font-size:14px;color:#78716c;margin:0 0 24px;">This tracks who added each consequence.</p>'+
    '<button onclick="setParent(\'Mom\')" style="display:block;width:100%;padding:14px;margin-bottom:10px;background:#1c1917;color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;">Mom</button>'+
    '<button onclick="setParent(\'Dad\')" style="display:block;width:100%;padding:14px;background:#1c1917;color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;">Dad</button>'+
    '</div></div>'+
    (state.showSettings ? renderSettingsModal() : '')+
    '</div>';
}

function renderApp() {
  return '<div class="screen">'+
    renderHeader()+
    renderView()+
    renderBottomNav()+
    (state.addStep>0 ? renderAddModal() : '')+
    (state.showSettings ? renderSettingsModal() : '')+
    '</div>';
}

function renderHeader() {
  var accent=COLORS[state.activeTab], light=LIGHT[state.activeTab];
  var tabs = state.view==="list" ?
    '<div class="tabs">'+KIDS.map(function(kid,i){
      var active=state.activeTab===i;
      var dot=state.consequences.filter(function(c){return c.kid_idx===i&&isActive(c);}).length>0;
      return '<button class="tab-btn" onclick="switchTab('+i+')" style="font-weight:'+(active?700:400)+';background:'+(active?LIGHT[i]:"#292524")+';color:'+(active?COLORS[i]:"#a8a29e")+';">'+
        kid+(dot?'<span style="position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:'+COLORS[i]+'"></span>':'')+
        '</button>';
    }).join("")+'</div>' :
    '<div style="padding-bottom:14px;padding-top:8px;"><span style="color:#e7e5e4;font-size:13px;font-weight:600;">'+
    {calendar:"All Kids · Calendar",weekly:"Weekly Summary",journal:"Behavior Journal"}[state.view]+
    '</span></div>';

  return '<div class="header">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">'+
    '<div><p>FAMILY</p><h1>Consequence Tracker</h1></div>'+
    '<div style="display:flex;align-items:center;gap:6px;">'+
    (state.syncing?'<span style="font-size:10px;color:#a8a29e;">↻</span>':'')+
    '<button class="gear-btn" onclick="openSettings()">⚙️</button>'+
    '<button class="parent-btn" onclick="switchParent()">'+state.currentParent+' ▾</button>'+
    '</div></div>'+tabs+'</div>';
}

function renderView() {
  if(state.view==="list") return renderList();
  if(state.view==="calendar") return renderCalendar();
  if(state.view==="weekly") return renderWeekly();
  if(state.view==="journal") return renderJournal();
  return "";
}

function renderList() {
  var i=state.activeTab, accent=COLORS[i], light=LIGHT[i], border=BORDERS[i];
  var kidC=state.consequences.filter(function(c){return c.kid_idx===i;});
  var active=kidC.filter(isActive);
  var inactive=kidC.filter(function(c){return!isActive(c);});
  var displayed=state.showHistory?kidC:active;

  var cards = displayed.length===0 ?
    '<div class="empty-state"><div class="empty-icon">🌟</div><p>No active consequences for '+KIDS[i]+'!</p></div>' :
    displayed.map(function(c){ return renderCard(c,border); }).join("");

  return '<div class="content">'+
    '<div class="kid-bar" style="background:'+light+';border:1px solid '+border+';">'+
    '<span style="font-size:13px;font-weight:600;color:#44403c;">'+KIDS[i]+'</span>'+
    '<button onclick="loadConsequences()" style="background:none;border:none;cursor:pointer;color:#a8a29e;font-size:11px;">↻ refresh</button>'+
    '</div>'+
    '<div class="stats">'+
    ['Active','Total','Resolved'].map(function(l,j){
      var v=[active.length,kidC.length,inactive.length][j];
      var c=[accent,"#78716c","#a8a29e"][j];
      return'<div class="stat-box"><div class="stat-num" style="color:'+c+'">'+v+'</div><div class="stat-label">'+l.toUpperCase()+'</div></div>';
    }).join("")+
    '</div>'+
    '<button class="add-btn" onclick="openAdd()" style="background:'+accent+';box-shadow:0 4px 14px '+accent+'44;"><span style="font-size:18px;">+</span> Add Consequence</button>'+
    (inactive.length>0?'<button onclick="toggleHistory()" style="background:none;border:none;cursor:pointer;color:#a8a29e;font-size:12px;margin-bottom:8px;">'+(state.showHistory?'▾ Hide resolved':'▸ Show '+inactive.length+' resolved')+'</button><br>':'')+
    cards+'</div>';
}

function renderCard(c, border) {
  var active=isActive(c);
  var comments=state.comments[c.id]||[];
  var open=state.openComments[c.id];
  return '<div class="card'+(active?'':' inactive')+'" style="border-color:'+(active?border:'#e7e5e4')+';">'+
    '<div class="card-row"><span class="card-title">'+c.description+'</span>'+statusBadge(c)+'</div>'+
    '<div class="card-date">Started '+fmtDate(c.start_date)+(c.end_date?' · Ends '+fmtDate(c.end_date):' · Ongoing')+'</div>'+
    (c.added_by?'<div class="card-by">Added by '+c.added_by+' · '+fmtDT(c.created_at)+'</div>':'')+
    (c.note?'<div class="card-note">"'+c.note+'"</div>':'')+
    (active?'<div class="card-actions"><button class="small-btn" style="border:1px solid #16a34a;color:#16a34a;" onclick="liftEarly('+c.id+')">✓ Lift early</button><button class="small-btn" style="border:1px solid #dc2626;color:#dc2626;" onclick="deleteC('+c.id+')">Delete</button></div>':'<div class="card-actions"><button class="small-btn" style="border:1px solid #9ca3af;color:#9ca3af;" onclick="deleteC('+c.id+')">Remove</button></div>')+
    '<div style="margin-top:10px;">'+
    '<button onclick="toggleComments('+c.id+')" style="background:none;border:none;cursor:pointer;color:#a8a29e;font-size:12px;padding:0;">'+
    (open?'▾ Hide notes':'▸ Parent notes'+(comments.length>0?' ('+comments.length+')':''))+
    '</button>'+
    (open?'<div style="margin-top:8px;">'+
      comments.map(function(cm){return'<div class="comment"><p style="margin:0;font-size:12px;color:#1c1917;">'+cm.body+'</p><p style="margin:3px 0 0;font-size:10px;color:#a8a29e;">'+cm.author+' · '+fmtDT(cm.created_at)+'</p></div>';}).join("")+
      '<div style="display:flex;gap:6px;margin-top:6px;">'+
      '<input id="comment-input-'+c.id+'" placeholder="Leave a note for your partner…" style="flex:1;padding:6px 8px;border:1px solid #e7e5e4;border-radius:8px;font-size:12px;outline:none;" onkeydown="if(event.key===\'Enter\')sendComment('+c.id+')"/>'+
      '<button onclick="sendComment('+c.id+')" style="padding:6px 12px;background:#1c1917;color:white;border:none;border-radius:8px;font-size:12px;cursor:pointer;">Send</button>'+
      '</div></div>':'')+
    '</div></div>';
}

function renderCalendar() {
  var y=state.calYear,m=state.calMonth;
  var dim=new Date(y,m+1,0).getDate();
  var fd=new Date(y,m,1).getDay();
  var today=todayStr();
  var label=new Date(y,m).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  var cells="";
  for(var i=0;i<fd;i++) cells+='<div></div>';
  for(var d=1;d<=dim;d++) {
    var ds=isoDay(y,m,d);
    var hits=cOnDay(state.consequences,ds);
    var kidIdxs=[...new Set(hits.map(function(c){return c.kid_idx;}))];
    var isTod=ds===today, isSel=state.calSel===d;
    cells+='<div class="cal-day'+(isTod?" today":"")+(isSel?" selected":"')+'" onclick="calSelect('+d+')" style="background:'+(isSel?"#1c1917":isTod?"#f5f5f4":"white")+';">'+
      '<span style="font-size:13px;font-weight:'+(isTod?700:400)+';color:'+(isSel?"white":isTod?"#1c1917":"#44403c")+'">'+d+'</span>'+
      '<div class="cal-dot-row">'+kidIdxs.map(function(ki){return'<span class="cal-dot" style="background:'+(isSel?"white":COLORS[ki%2])+'"></span>';}).join("")+'</div>'+
      '</div>';
  }
  var selDate=state.calSel?isoDay(y,m,state.calSel):null;
  var selC=selDate?cOnDay(state.consequences,selDate):[];
  return '<div class="content" style="padding-top:16px;">'+
    '<div style="display:flex;gap:16px;margin-bottom:14px;justify-content:center;">'+
    KIDS.map(function(kid,i){return'<div style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:50%;background:'+COLORS[i]+';display:inline-block;"></span><span style="font-size:12px;color:#78716c;">'+kid+'</span></div>';}).join("")+
    '</div>'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">'+
    '<button onclick="calPrev()" style="background:none;border:1px solid #e7e5e4;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;color:#44403c;">&lt;</button>'+
    '<span style="font-weight:700;font-size:15px;color:#1c1917;">'+label+'</span>'+
    '<button onclick="calNext()" style="background:none;border:1px solid #e7e5e4;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;color:#44403c;">&gt;</button>'+
    '</div>'+
    '<div class="calendar-grid" style="margin-bottom:4px;">'+["Su","Mo","Tu","We","Th","Fr","Sa"].map(function(d){return'<div style="text-align:center;font-size:10px;color:#a8a29e;font-weight:700;">'+d+'</div>';}).join("")+'</div>'+
    '<div class="calendar-grid">'+cells+'</div>'+
    (selDate?'<div style="margin-top:16px;background:white;border:1px solid #e7e5e4;border-radius:12px;padding:16px;">'+
      '<p style="margin:0 0 10px;font-size:13px;font-weight:700;color:#44403c;">'+new Date(selDate+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})+'</p>'+
      (selC.length===0?'<p style="margin:0;font-size:13px;color:#a8a29e;">No active consequences this day 🌟</p>':
        selC.map(function(c){return'<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;"><span style="width:10px;height:10px;border-radius:50%;background:'+COLORS[c.kid_idx%2]+';flex-shrink:0;margin-top:3px;display:inline-block;"></span><div><p style="margin:0;font-size:13px;font-weight:600;color:#1c1917;">'+KIDS[c.kid_idx]+': '+c.description+'</p>'+(c.note?'<p style="margin:2px 0 0;font-size:11px;color:#a8a29e;font-style:italic;">"'+c.note+'"</p>':'')+' </div></div>';}).join(""))+
      '</div>':'')+'</div>';
}

function renderWeekly() {
  var expiring=state.consequences.filter(function(c){if(!isActive(c))return false;var l=daysLeft(c.end_date);return l!==null&&l<=3;});
  var weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-7);
  var resolved=state.consequences.filter(function(c){return!isActive(c)&&c.created_at&&new Date(c.created_at)>weekAgo;});
  return '<div class="content" style="padding-top:16px;">'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">'+
    KIDS.map(function(kid,i){
      var ka=state.consequences.filter(function(c){return c.kid_idx===i&&isActive(c);});
      var ke=ka.filter(function(c){var l=daysLeft(c.end_date);return l!==null&&l<=3;});
      return'<div class="summary-card" style="border:2px solid '+BORDERS[i]+';">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><span style="width:10px;height:10px;border-radius:50%;background:'+COLORS[i]+';display:inline-block;"></span><span style="font-weight:700;font-size:14px;color:#1c1917;">'+kid+'</span></div>'+
        '<div style="font-size:28px;font-weight:700;color:'+COLORS[i]+';line-height:1;">'+ka.length+'</div>'+
        '<div style="font-size:11px;color:#a8a29e;margin-bottom:8px;">ACTIVE</div>'+
        (ke.length>0?'<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:6px 8px;"><span style="font-size:11px;color:#dc2626;font-weight:700;">⚠ '+ke.length+' ending soon</span></div>':'<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:6px 8px;"><span style="font-size:11px;color:#16a34a;font-weight:700;">🌟 All clear!</span></div>')+
        '</div>';
    }).join("")+'</div>'+
    (expiring.length>0?'<p style="margin:0 0 8px;font-size:11px;color:#dc2626;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">⏰ Expiring Within 3 Days</p>'+
      expiring.map(function(c){return'<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;"><div><p style="margin:0;font-size:13px;font-weight:600;color:#1c1917;">'+KIDS[c.kid_idx]+': '+c.description+'</p><p style="margin:2px 0 0;font-size:11px;color:#a8a29e;">Ends '+fmtDate(c.end_date)+'</p></div>'+statusBadge(c)+'</div>';}).join(""):'')+
    '<p style="margin:0 0 8px;font-size:11px;color:#78716c;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">✅ Resolved This Week</p>'+
    (resolved.length===0?'<p style="font-size:13px;color:#a8a29e;">None yet this week.</p>':
      resolved.map(function(c){return'<div style="background:white;border:1px solid #e7e5e4;border-radius:10px;padding:10px 14px;margin-bottom:6px;opacity:.7;"><p style="margin:0;font-size:13px;color:#44403c;">'+KIDS[c.kid_idx]+': '+c.description+'</p><p style="margin:2px 0 0;font-size:11px;color:#a8a29e;">'+fmtDT(c.created_at)+(c.added_by?' by '+c.added_by:'')+'</p></div>';}).join(""))+
    '</div>';
}

function renderJournal() {
  var ki=state.journalKid;
  var entries=state.journalEntries.filter(function(e){return e.kid_idx===ki;});
  return '<div class="content" style="padding-top:16px;">'+
    '<div style="display:flex;gap:8px;margin-bottom:16px;">'+
    KIDS.map(function(kid,i){return'<button onclick="setJournalKid('+i+')" style="flex:1;padding:10px 8px;border:2px solid '+(ki===i?COLORS[i]:"#e7e5e4")+';border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;background:'+(ki===i?LIGHT[i]:"white")+';color:'+(ki===i?COLORS[i]:"#78716c")+';">'+kid+'</button>';}).join("")+
    '</div>'+
    '<textarea id="journal-input" placeholder="Note something about '+KIDS[ki]+'\'s behavior..." style="width:100%;min-height:80px;resize:vertical;padding:8px 10px;border:1px solid #e7e5e4;border-radius:8px;font-size:14px;outline:none;background:#fafaf9;margin-bottom:8px;"></textarea>'+
    '<button onclick="addJournalEntry()" style="padding:10px 20px;background:'+COLORS[ki]+';color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:20px;">Add Note</button>'+
    (entries.length===0?'<p style="color:#a8a29e;font-size:13px;">No journal entries yet for '+KIDS[ki]+'.</p>':
      entries.map(function(e){return'<div class="journal-entry"><p style="margin:0;font-size:13px;color:#1c1917;line-height:1.5;">'+e.entry+'</p><p style="margin:6px 0 0;font-size:11px;color:#a8a29e;">'+fmtDT(e.created_at)+(e.added_by?' · '+e.added_by:'')+'</p></div>';}).join(""))+
    '</div>';
}

function renderBottomNav() {
  var tabs=[{id:"list",label:"LIST",icon:"☰"},{id:"calendar",label:"CALENDAR",icon:"📅"},{id:"weekly",label:"SUMMARY",icon:"📊"},{id:"journal",label:"JOURNAL",icon:"📓"}];
  return '<div class="bottom-nav">'+
    tabs.map(function(t){
      var active=state.view===t.id;
      return'<button class="nav-btn" onclick="switchView(\''+t.id+'\')" style="color:'+(active?"#1c1917":"#a8a29e")+';">'+
        '<span class="nav-icon">'+t.icon+'</span>'+
        '<span class="nav-label" style="font-weight:'+(active?700:400)+';">'+t.label+'</span>'+
        (active?'<span class="nav-bar"></span>':'')+
        '</button>';
    }).join("")+'</div>';
}

function renderAddModal() {
  var cp=canProceed();
  var desc=state.selectedPreset?(state.selectedPreset.custom?state.customText:state.selectedPreset.text):"";
  var s1=state.addStep===1, s2=state.addStep===2;
  var ed=state.addDuration?addDays(state.addStart,state.addDuration-1):null;

  var overlapHtml="";
  if(state.overlapWarning) {
    overlapHtml='<div class="overlap-overlay">'+
      '<div style="font-size:40px;margin-bottom:12px;">⚠️</div>'+
      '<h3 style="margin:0 0 8px;font-size:18px;font-weight:700;color:#1c1917;text-align:center;">Too Many Consequences</h3>'+
      '<p style="margin:0 0 16px;font-size:14px;color:#78716c;text-align:center;line-height:1.5;"><strong>'+KIDS[state.addKidIdx]+'</strong> already has '+state.overlapWarning.list.length+' active consequences during this period.</p>'+
      '<div style="width:100%;margin-bottom:20px;">'+
      state.overlapWarning.list.map(function(c){return'<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 14px;margin-bottom:8px;"><p style="margin:0;font-size:13px;font-weight:600;color:#1c1917;">'+c.description+'</p><p style="margin:2px 0 0;font-size:11px;color:#a8a29e;">'+fmtDate(c.start_date)+(c.end_date?' – '+fmtDate(c.end_date):' (ongoing)')+'</p></div>';}).join("")+
      '</div>'+
      '<p style="margin:0 0 20px;font-size:13px;color:#dc2626;font-weight:600;text-align:center;">We recommend resolving an existing consequence first.</p>'+
      '<button onclick="goStep1()" style="width:100%;padding:14px;background:#1c1917;color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;">← Go Back & Review</button>'+
      '<button onclick="confirmAnyway()" style="width:100%;padding:12px;background:white;color:#dc2626;border:2px solid #dc2626;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">Add Anyway</button>'+
      '</div>';
  }

  var step1Html="", step2Html="";

  if(s1) {
    step1Html='<div class="modal-header"><h2 style="margin:0;font-size:18px;font-weight:700;color:#1c1917;">Choose a Consequence</h2><p style="margin:4px 0 0;font-size:13px;color:#a8a29e;">Tap a category, then select one</p></div>'+
      '<div class="modal-body">'+
      PRESETS.map(function(cat,ci){
        var open=state.openCat===ci;
        return'<div class="preset-cat">'+
          '<button class="preset-cat-btn'+(open?" open":"'")+'" onclick="toggleCat('+ci+')" style="'+(open?"background:#1c1917;color:white;":"")+'"">'+cat.icon+' '+cat.cat+' <span style="font-size:11px;">'+(open?"▲":"▼")+'</span></button>'+
          (open?'<div class="preset-items">'+
            cat.items.map(function(item){
              var sel=state.selectedPreset&&state.selectedPreset.text===item&&!state.selectedPreset.custom;
              return'<div class="preset-item'+(sel?" selected":"'")+'" onclick="selectPreset(\''+item.replace(/'/g,"\\'")+'\')" style="'+(sel?"background:#fff7ed;":"")+'"">'+
                '<div class="checkbox'+(sel?" checked":"'")+'" style="'+(sel?"background:#f97316;border:none;":"")+'">'+(sel?'<span style="color:white;font-size:12px;font-weight:700;">✓</span>':'')+' </div>'+
                '<span style="font-size:13px;color:#1c1917;line-height:1.4;">'+item+'</span>'+
                '</div>';
            }).join("")+
          '</div>':'')+'</div>';
      }).join("")+
      '<div style="margin-top:4px;padding:12px 14px;background:#fafaf9;border:1px solid #e7e5e4;border-radius:10px;">'+
      '<div onclick="selectCustom()" style="display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:'+(state.selectedPreset&&state.selectedPreset.custom?10:0)+'px;">'+
      '<div class="checkbox'+(state.selectedPreset&&state.selectedPreset.custom?" checked":"'")+'" style="'+(state.selectedPreset&&state.selectedPreset.custom?"background:#f97316;border:none;":"")+'">'+(state.selectedPreset&&state.selectedPreset.custom?'<span style="color:white;font-size:12px;font-weight:700;">✓</span>':'')+' </div>'+
      '<span style="font-size:13px;font-weight:600;color:#1c1917;">✏️ Write a custom consequence</span></div>'+
      (state.selectedPreset&&state.selectedPreset.custom?'<input id="custom-input" class="input" placeholder="Type your consequence here…" style="margin-top:4px;"/>':'')+
      '</div>'+
      '</div>'+
      '<div style="padding:0 16px;">'+
      '<button onclick="goStep2()" style="width:100%;padding:14px;background:'+(cp?"#1c1917":"#e7e5e4")+';color:'+(cp?"white":"#a8a29e")+';border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:'+(cp?"pointer":"default")+';">Continue →</button>'+
      '</div>';
  }

  if(s2) {
    step2Html='<div class="modal-header">'+
      '<button onclick="goStep1()" style="background:none;border:none;cursor:pointer;color:#a8a29e;font-size:13px;padding:0;margin-bottom:6px;">← Back</button>'+
      '<h2 style="margin:0;font-size:18px;font-weight:700;color:#1c1917;">Assign & Set Duration</h2>'+
      '<p style="margin:6px 0 0;font-size:13px;color:#44403c;font-style:italic;background:#f5f5f4;padding:8px 10px;border-radius:8px;line-height:1.4;">"'+desc+'"</p>'+
      '</div>'+
      '<div class="modal-body">'+
      '<label class="field-label">Assign to</label>'+
      '<div class="kid-selector">'+
      KIDS.map(function(kid,i){return'<button class="kid-sel-btn" onclick="setAddKid('+i+')" style="border-color:'+(state.addKidIdx===i?COLORS[i]:"#e7e5e4")+';background:'+(state.addKidIdx===i?LIGHT[i]:"white")+';color:'+(state.addKidIdx===i?COLORS[i]:"#78716c")+';">'+kid+'</button>';}).join("")+
      '</div>'+
      '<label class="field-label">Start date</label>'+
      '<input type="date" id="add-start-date" class="input" style="margin-bottom:20px;"/>'+
      '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;">'+
      '<label class="field-label" style="margin:0;">Duration</label>'+
      '<span style="font-size:11px;color:#dc2626;font-weight:600;">max 30 days</span>'+
      '</div>'+
      '<p style="margin:0 0 10px;font-size:12px;color:#78716c;">'+(ed?'Ends: '+fmtDate(ed):'No end date (ongoing)')+'</p>'+
      '<div class="duration-grid">'+
      DURATIONS.map(function(d){return'<button class="dur-btn'+(state.addDuration===d.days?" active":"'")+'" onclick="setDuration('+d.days+')" style="'+(state.addDuration===d.days?"border-color:#1c1917;background:#1c1917;color:white;":"")+'"">'+d.label+'</button>';}).join("")+
      '<button class="dur-btn wide'+(state.addDuration===null?" active":"'")+'" onclick="setDuration(null)" style="'+(state.addDuration===null?"border-color:#1c1917;background:#1c1917;color:white;":"")+'"">Ongoing (no end)</button>'+
      '</div>'+
      '<label class="field-label">Note (optional)</label>'+
      '<input id="add-note-input" class="input" placeholder="e.g. No exceptions on weekends" style="margin-bottom:20px;"/>'+
      '<button onclick="submitAdd()" style="width:100%;padding:14px;background:'+COLORS[state.addKidIdx]+';color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px '+COLORS[state.addKidIdx]+'44;">Assign to '+KIDS[state.addKidIdx]+' ✓</button>'+
      '</div>';
  }

  return'<div class="modal-bg" onclick="if(event.target===this)closeAdd()">'+
    '<div class="modal">'+
    '<div class="modal-handle"><div></div></div>'+
    step1Html+step2Html+overlapHtml+
    '</div></div>';
}

function renderSettingsModal() {
  return'<div style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end;" onclick="if(event.target===this)closeSettings()">'+
    '<div class="settings-modal">'+
    '<div style="display:flex;justify-content:center;padding:12px 0 0;"><div style="width:36px;height:4px;border-radius:2px;background:#e7e5e4;"></div></div>'+
    '<div style="padding:12px 20px 14px;border-bottom:1px solid #f5f5f4;display:flex;justify-content:space-between;align-items:center;">'+
    '<h2 style="margin:0;font-size:18px;font-weight:700;color:#1c1917;">⚙️ Settings</h2>'+
    '<button onclick="closeSettings()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#a8a29e;line-height:1;">×</button>'+
    '</div>'+
    '<div style="padding:16px;">'+
    '<div class="status-badge" style="background:#f0fdf4;border:1px solid #bbf7d0;">'+
    '<span style="font-size:22px;">🟢</span>'+
    '<div><p style="margin:0;font-size:13px;font-weight:700;color:#1c1917;">Connected to Supabase</p>'+
    '<p style="margin:2px 0 0;font-size:11px;color:#78716c;">API key is permanently built into this app</p></div>'+
    '</div>'+
    (state.currentParent?
      '<div style="border-top:1px solid #f5f5f4;padding-top:16px;">'+
      '<label class="field-label">Signed in as</label>'+
      '<div style="display:flex;align-items:center;justify-content:space-between;background:#fafaf9;border:1px solid #e7e5e4;border-radius:10px;padding:10px 14px;">'+
      '<span style="font-size:14px;font-weight:600;color:#1c1917;">'+state.currentParent+'</span>'+
      '<button onclick="switchParent();closeSettings();" style="padding:5px 12px;background:white;border:1px solid #6b7280;border-radius:6px;color:#6b7280;cursor:pointer;font-size:12px;font-weight:600;">Switch Parent</button>'+
      '</div></div>':'')+
    '</div></div></div>';
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
function init() {
  store_get("current_parent")
    .then(function(r){ state.currentParent=r.value||null; })
    .catch(function(){ state.currentParent=null; })
    .then(function() {
      render();
      loadConsequences();
      setInterval(loadConsequences, 15000);
    });
}

init();


// ── HIDE SPLASH AFTER LOAD ──────────────────────────────
function hideSplash() {
  var s = document.getElementById("splash");
  if (s) {
    s.classList.add("hidden");
    setTimeout(function(){ s.style.display="none"; }, 400);
  }
}

// Override renderParentSelector to use new native-looking design
renderParentSelector = function() {
  var settingsHtml = state.showSettings ? renderSettingsModal() : "";
  return [
    '<div class="parent-screen">',
    '<div style="display:flex;justify-content:flex-end;margin-bottom:auto;padding-top:8px;">',
    '<button class="gear-btn" onclick="openSettings()">&#9881;&#65039;</button>',
    '</div>',
    '<div style="flex:1;display:flex;align-items:center;justify-content:center;">',
    '<div class="parent-card">',
    '<div style="font-size:48px;margin-bottom:16px;">&#128075;</div>',
    '<h2 style="font-size:22px;font-weight:700;color:#1c1917;margin:0 0 8px;">Welcome back!</h2>',
    '<p style="font-size:14px;color:#78716c;margin:0 0 28px;line-height:1.5;">Who is managing consequences today?</p>',
    '<button class="parent-name-btn" onclick="setParent(' + "'" + 'Mom' + "'" + ')" style="background:#f97316;color:white;">&#128105; Mom</button>',
    '<button class="parent-name-btn" onclick="setParent(' + "'" + 'Dad' + "'" + ')" style="background:#8b5cf6;color:white;margin-bottom:0;">&#128104; Dad</button>',
    '</div></div>',
    settingsHtml,
    '</div>'
  ].join("");
};

// Override init to hide splash when ready
var _origInit = init;
init = function() {
  store_get("current_parent")
    .then(function(r){ state.currentParent=r.value||null; })
    .catch(function(){ state.currentParent=null; })
    .then(function() {
      render();
      hideSplash();
      loadConsequences();
      setInterval(loadConsequences, 15000);
    });
};

init();
</script>
</body>
